name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel in-flight runs for the same branch on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 1. Static checks + unit tests on every push.
  # ---------------------------------------------------------------------
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check src tests --exit-non-zero-on-fix || true

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ -v --tb=short --color=yes

  # ---------------------------------------------------------------------
  # 2. Eval scripts smoke test (synthetic data + random checkpoint).
  #    Faster than training, validates the full pipeline end-to-end.
  # ---------------------------------------------------------------------
  eval-smoke:
    name: Eval scripts smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: RetinaFace WIDER eval smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_eval_retinaface_wider.py -v

      - name: UNet eval smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/test_eval_unet_smoke.py
